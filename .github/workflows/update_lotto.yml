name: Auto Update Lottery Data

on:
  schedule:
    # Runs at 10:00 UTC (17:00 Thai Time) on the 1st and 16th of every month
    - cron: '0 10 1,16 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Latest Lotto Data
        run: node scripts/fetch_all_lotto.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update lottery data $(date +'%Y-%m-%d')" && git push)
